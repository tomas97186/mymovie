<div class="login-wrap">
  <div class="login-container">
    <div class="brand">
      <h1>{{ "pages.signup.labels.registrati" | translate }}</h1>
      <p class="subtitle">
        {{ "pages.signup.labels.descrizione" | translate }}
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <ion-input
        label="Email"
        type="email"
        placeholder="test@email.com"
        formControlName="email"
      >
      </ion-input>

      <ion-input
        label="Password"
        type="password"
        formControlName="password"
        maxlength="30"
        minlength="8"
        errorText="{{ 'pages.signup.labels.passwordHelp' | translate }}"
        helperText="{{ 'pages.signup.labels.passwordHelp' | translate }}"
      >
        <ion-input-password-toggle slot="end"></ion-input-password-toggle
      ></ion-input>

      <ion-input
        label="Ripeti la Password"
        type="password"
        maxlength="30"
        minlength="8"
        formControlName="repeatPassword"
      >
        <ion-input-password-toggle slot="end"></ion-input-password-toggle
      ></ion-input>

      <ion-button
        class="w-100"
        type="submit"
        [disabled]="form.invalid || loading()"
      >
        @if(loading()) {
        <ion-spinner slot="start"></ion-spinner>
        }
        {{
          "pages.signup.buttons." +
            (loading() ? "registrazioneInCorso" : "registrati") | translate
        }}
      </ion-button>
    </form>
    <div class="login-link">
      <a routerLink="/login"
        ><ion-icon name="return-up-back-outline" class="me-2"></ion-icon>
        {{ "shared.labels.returnToLogin" | translate }}
      </a>
    </div>
  </div>
</div>
