<ion-app>
  @let user = currentUser$ | async; @if(user) {
  <ion-tabs>
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="home">
        <ion-icon aria-hidden="true" name="home"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="search">
        <ion-icon aria-hidden="true" name="search"></ion-icon>
        <ion-label>Cerca</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="lists">
        <ion-icon aria-hidden="true" name="list"></ion-icon>
        <ion-label>Liste</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="profile">
        <ion-icon aria-hidden="true" name="person"></ion-icon>
        <ion-label>Profilo</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-tabs>
  } @else {
  <ion-router-outlet></ion-router-outlet>
  }
</ion-app>
