<ion-list>
  @for(friend of friendList(); track friend.uid) {
  <!-- @let username = getUsername(friend.uid!) | async; -->
  <ion-item button="true" [detail]="friend.status === FriendStatusEnum.ACCEPTED"
    [routerLink]="['/community', friend.user.uid]">
    <ion-avatar aria-hidden="true" slot="start">
      <img alt="" [src]="userData.getUserAvatar(friend.uid!)" />
    </ion-avatar>
    <ion-label>
      {{friend.user.username!}}
    </ion-label>
    @if(friend.status === FriendStatusEnum.PENDING) {
    <ion-button slot="end" size="small" fill="outline" color="danger" (click)="declineFriendRequest($event, friend)">
      <ion-icon name="close" slot="icon-only"></ion-icon>
    </ion-button>
    <ion-button slot="end" color="success" fill="outline" size="small" (click)="acceptFriendRequest($event, friend)">
      <ion-icon name="checkmark" slot="icon-only"></ion-icon>
    </ion-button>

    }
  </ion-item>
  }
</ion-list>
