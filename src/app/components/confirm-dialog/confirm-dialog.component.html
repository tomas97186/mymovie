<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
    <p>{{data.body}}</p>
</mat-dialog-content>
<mat-dialog-actions>
    <ion-button mat-dialog-close>Annulla</ion-button>
    <ion-button [mat-dialog-close]="true" cdkFocusInitial>
        Conferma
    </ion-button>
</mat-dialog-actions>
