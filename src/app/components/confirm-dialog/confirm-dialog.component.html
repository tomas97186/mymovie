<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
    <p>{{data.body}}</p>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button mat-dialog-close>Annulla</button>
    <button mat-button [mat-dialog-close]="true" cdkFocusInitial>
        Conferma
    </button>
</mat-dialog-actions>
