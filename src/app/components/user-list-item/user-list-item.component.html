@let list = this.list();

<div class="list-item" [routerLink]="invitation() ? undefined : '-' + list.id">
  <div class="list-info">
    <h6>{{ list.name }}</h6>
    <div class="list-meta">
      <div class="list-meta-item">
        <ion-icon size="small" name="film-outline"></ion-icon
        ><span>{{ list.moviesCount }} film</span>
      </div>
      <div class="list-meta-item">
        <ion-icon size="small" name="people-outline"></ion-icon>
        {{ list.membersCount }} membri
      </div>
    </div>
  </div>
  <div>
    @if(invitation()) {
    <ion-button
      class="danger me-2"
      ion-icon-button
      (click)="declineInvitation()"
    >
      <ion-icon name="close"></ion-icon>
    </ion-button>
    <ion-button class="success" ion-icon-button (click)="acceptInvitation()">
      <ion-icon name="check"></ion-icon>
    </ion-button>

    } @else {
    <div class="actions">
      <ion-button fill="clear" (click)="shareListCode($event)">
        <ion-icon name="share-social-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button fill="clear">
        <ion-icon name="chevron-forward"></ion-icon>
      </ion-button>
    </div>
    }
  </div>
</div>
