<ion-header>
  <ion-toolbar>

    <ion-title>Invita Utente</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()"  size="small" [disabled]="!usernameControl.valid">Conferma</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<div class="p-3 h-100">
  <ion-item>
    <ion-input label="Username"  type="text" placeholder="Username utente"
      [formControl]="usernameControl"></ion-input>
  </ion-item>
</div>
