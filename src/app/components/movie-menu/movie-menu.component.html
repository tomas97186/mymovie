<mat-nav-list class="movie-menu">
    <h4 class="mt-2">{{this.data.movie.title}}</h4>
    <hr>
    @if(openedFromList && listId) {
    @if(!this.data.movie.watched) {
    <mat-list-item (click)="setAsWatched(listId!)">
        <ion-icon matListItemIcon name="check"></ion-icon>
        <span matListItemTitle>Segna come visto</span>
    </mat-list-item>
    }
    <mat-list-item (click)="removeMovieFromList(listId!)">
        <ion-icon matListItemIcon name="delete"></ion-icon>
        <span matListItemTitle>Rimuovi dalla lista</span>
    </mat-list-item>
    } @else {
    <mat-list-item (click)="openListDialog()">
        <ion-icon matListItemIcon name="add"></ion-icon>
        <span matListItemTitle>Aggiungi ad una lista</span>
    </mat-list-item>
    }
    <mat-list-item (click)="navigateToMovieDetails()">
        <ion-icon matListItemIcon name="search"></ion-icon>
        <span matListItemTitle>Visualizza Dettagli</span>
    </mat-list-item>

</mat-nav-list>
