@if(settings(); as settings) {
<div class="section-header">
    <h4>{{settings.title}}</h4>
    <button mat-button (click)="navigateToAll()">Vedi Altri</button>
</div>
@if(settings.data$ | async; as data) {
<app-movie-list [movies]="data.results" [isHorizontal]="true"></app-movie-list>
} @else {
<div class="placeholder-container">
    @for(n of [].constructor(10); track $index)
    {
    <div class="image-placeholder"></div>
    }
</div>
}
}
