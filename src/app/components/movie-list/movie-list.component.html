@let movies = this.movies()!;
<div
  #movieList
  id="movieList"
  class="movie-list-container"
  [ngStyle]="{ 'padding-top': paddingTop() ? paddingTop() + 'px' : undefined }"
  [ngClass]="{'horizontal': isHorizontal(),}"
>
  @for(movie of movies; track movie.id) {
  <app-movie-card [movie]="movie" class="p-0"></app-movie-card>
  }
</div>
@if(!this.isHorizontal() && total() > movies.length) {
<ion-infinite-scroll (ionInfinite)="this.loadMore($event)">
  <ion-infinite-scroll-content></ion-infinite-scroll-content>
</ion-infinite-scroll>
}
