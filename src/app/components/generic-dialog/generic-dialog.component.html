<ion-header>
  <ion-toolbar>

    <ion-title>{{ data.title }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()"  size="small" [disabled]="!form.valid">Conferma</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<div class="p-3 h-100">
  @if(data.description) {
  <p>{{ data.description }}</p>
  }
  <form [formGroup]="form">
    <ion-item>
      <ion-input label="{{data.field}}"  type="text" [formControlName]="'name'"></ion-input>
    </ion-item>
  </form>
</div>
