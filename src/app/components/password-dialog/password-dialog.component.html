<h2 mat-dialog-title>Cambio Password</h2>
<mat-dialog-content>
    <form [formGroup]="form" class="form">

        <mat-form-field class="w-100">
            <mat-label>Password Attuale</mat-label>
            <input matInput formControlName="oldPassword" [type]="hideOldPassword() ? 'password' : 'text'" />
            <button mat-icon-button matSuffix type="button" (click)="hideOldPassword.set(!hideOldPassword())"
                [attr.aria-label]="hideOldPassword() ? 'Mostra password' : 'Nascondi password'">
                <mat-icon>{{ hideOldPassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
        </mat-form-field>
        <mat-form-field class="w-100">
            <mat-label>Nuova Password</mat-label>
            <input matInput formControlName="newPassword" [type]="hideNewPassword() ? 'password' : 'text'" />
            <button mat-icon-button matSuffix type="button" (click)="hideNewPassword.set(!hideNewPassword())"
                [attr.aria-label]="hideNewPassword() ? 'Mostra password' : 'Nascondi password'">
                <mat-icon>{{ hideNewPassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
            </button>
        </mat-form-field>
        <p>La nuova password deve contenere almeno: </p>
        <ul>
            <li>
                Una lettera maiuscola (A-Z)
            </li>
            <li>
                Una lettera minuscola (a-z)
            </li>
            <li>
                Un numero (0-9)
            </li>
            <li>
                Un simbolo (es. ! &#64; # $ % ^ & *)
            </li>
        </ul>
    </form>

</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button (click)="close()">Annulla</button>
    <button mat-button [mat-dialog-close]="{oldPassword: form.value.oldPassword, newPassword: form.value.newPassword}"
        [disabled]="!form.valid" cdkFocusInitial>Conferma</button>
</mat-dialog-actions>
