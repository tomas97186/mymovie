<ion-header>
    <ion-toolbar>
        <ion-title>Nuova Lista</ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="close()" color="success" [disabled]="!form.valid">Conferma</ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>
<div class="p-3 h-100">
    <form [formGroup]="form">
        <ion-item>
            <ion-input label="Nome Lista"  type="text" formControlName="name" maxlength="20" [counter]="true"></ion-input>
        </ion-item>
    </form>
</div>
