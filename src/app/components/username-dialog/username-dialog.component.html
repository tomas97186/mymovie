<ion-header>
  <ion-toolbar>

    <ion-title>Modifica Username</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()" color="success" [disabled]="!form.valid">Conferma</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<div class="p-3 h-100">
  <form [formGroup]="form">
    <ion-item>
      <ion-input label="Username"  type="text" formControlName="name"></ion-input>
    </ion-item>
  </form>
</div>
